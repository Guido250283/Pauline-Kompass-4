<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paulines Kompass-Quest</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Kompass-Quest">
<meta name="theme-color" content="#140d33">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#f3c45a;--gold-d:#a86a10;--ink:#2b1d0e;--parch:#fff8e6;--parch2:#f3e2bb;--edge:#c9a35c;--ok:#2f9e57;--bad:#c8463b;--violet:#2a1b5e}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:#140d33;-webkit-tap-highlight-color:transparent}
#sky{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 50% -10%,#5b3fa8 0%,#2a1b5e 40%,#140d33 80%);overflow:hidden}
#sky i{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.8;animation:tw 3s infinite alternate}
@keyframes tw{from{opacity:.2}to{opacity:1}}
#sky .moon{position:absolute;top:28px;right:24px;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe8,#f5dc8f 60%,#d9b65a);box-shadow:0 0 40px #f5dc8f88}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:12px 14px 60px}
h1,h2,h3,.medieval{font-family:MedievalSharp,Georgia,serif;font-weight:400}
.top{display:flex;align-items:center;gap:10px;background:rgba(20,12,50,.7);border:2px solid #f3c45a55;border-radius:16px;padding:8px 12px;color:#fde9b0;position:sticky;top:8px;z-index:5;backdrop-filter:blur(6px)}
.top .pet{font-size:34px;line-height:1}
.top .who{flex:1;min-width:0}
.top .who b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who small{font-size:12px;opacity:.85}
.bar{height:8px;background:#ffffff22;border-radius:6px;overflow:hidden;margin-top:3px}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,#f3c45a,#ffe9a3);border-radius:6px;transition:width .6s}
.gems{font-weight:900;font-size:18px;white-space:nowrap}
.iconbtn{background:none;border:none;color:#fde9b0;font-size:22px;padding:4px;cursor:pointer}
.card{background:linear-gradient(170deg,var(--parch),var(--parch2));border:3px solid var(--edge);border-radius:20px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 30px #c9a35c33;margin-top:14px;position:relative}
.card h2{margin:0 0 8px;font-size:26px;color:#5a2d0c}
.lead{color:#fde9b0;text-align:center}
.lead h1{font-size:38px;margin:18px 0 4px;text-shadow:0 3px 12px #000}
.btn{font:800 18px Nunito,sans-serif;padding:13px 20px;border-radius:14px;border:none;background:linear-gradient(#ffe08a,#f0a92c);color:#4a2a00;box-shadow:0 4px 0 var(--gold-d);cursor:pointer;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-d)}
.btn.sec{background:linear-gradient(#efe4ff,#c9b6f2);color:#2a1b5e;box-shadow:0 4px 0 #7a62b5}
.btn.ghost{background:transparent;color:#5a2d0c;box-shadow:none;border:2px dashed var(--edge)}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.row .btn{flex:1}
input.ans{font:800 22px Nunito,sans-serif;padding:12px 14px;border-radius:12px;border:3px solid var(--edge);background:#fffdf5;width:100%;color:var(--ink)}
input.ans:focus{outline:none;border-color:#7a62b5;box-shadow:0 0 0 4px #7a62b533}
.field{display:flex;align-items:center;gap:8px;margin-top:10px}
.field label{font-weight:800;min-width:0;flex:0 0 auto;max-width:48%}
.field .unit{font-weight:800}
.q{font-size:19px;line-height:1.5}
.q b{color:#7a2e0b}
.story{font-style:italic;color:#6b4a1f;margin-bottom:8px;font-size:16px}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{font:700 17px Nunito,sans-serif;text-align:left;padding:13px 14px;border-radius:12px;border:3px solid var(--edge);background:#fffdf5;cursor:pointer;color:var(--ink)}
.opt.sel{border-color:#7a62b5;background:#efe7ff}
.opt.right{border-color:var(--ok);background:#dff5e6}
.opt.wrong{border-color:var(--bad);background:#fde3e0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{font:800 19px Nunito,sans-serif;padding:9px 12px;border-radius:12px;border:3px solid var(--edge);background:#fffdf5;cursor:pointer;color:var(--ink)}
.chip.sel{background:#7a62b5;color:#fff;border-color:#4b3690}
.fb{margin-top:14px;padding:12px 14px;border-radius:14px;font-size:17px;line-height:1.45;display:none}
.fb.show{display:block;animation:pop .25s}
.fb.good{background:#dff5e6;border:2px solid var(--ok)}
.fb.hint{background:#fff1c9;border:2px solid #e0a82e}
.fb.sol{background:#efe7ff;border:2px solid #7a62b5}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.progress{display:flex;gap:5px;margin:6px 0 12px}
.progress span{flex:1;height:9px;border-radius:5px;background:#0000001f}
.progress span.ok{background:var(--ok)}.progress span.half{background:#e0a82e}.progress span.no{background:var(--bad)}.progress span.cur{background:#7a62b5}
.taskhead{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:#6b4a1f}
.tag{font-size:13px;background:#5a2d0c;color:#fde9b0;border-radius:20px;padding:3px 10px}
table.t{border-collapse:collapse;margin:10px 0;font-size:17px;background:#fffdf5}
table.t td,table.t th{border:2px solid var(--edge);padding:6px 10px;text-align:left}
table.t th{background:#f3e2bb}
.textbox{background:#fffdf5;border:2px solid var(--edge);border-radius:12px;padding:12px 14px;font-size:17px;line-height:1.6;margin-bottom:10px}
.textbox h4{margin:0 0 6px;font-family:MedievalSharp,serif;font-size:19px;font-weight:400}
svg.fig{display:block;margin:10px auto;max-width:100%}
/* Map */
.map{position:relative;margin-top:10px}
.map svg.path{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,0);width:150px;text-align:center;cursor:pointer;color:#fde9b0}
.node .disc{width:84px;height:84px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:42px;background:radial-gradient(circle at 35% 30%,#fff6d8,#e7c06a 70%,#a87a2a);border:4px solid #fff3c4;box-shadow:0 0 0 4px #00000033,0 8px 18px #000a;transition:transform .15s}
.node.m .disc{background:radial-gradient(circle at 35% 30%,#e9fff0,#7fd6a0 70%,#2f8a57)}
.node.d .disc{background:radial-gradient(circle at 35% 30%,#f2ecff,#b09cf0 70%,#5a43a8)}
.node.final .disc{width:100px;height:100px;font-size:52px;background:radial-gradient(circle at 35% 30%,#fff,#ffb36b 60%,#c2410c)}
.node.locked .disc{filter:grayscale(1) brightness(.6)}
.node:active .disc{transform:scale(.94)}
.node b{display:block;font-family:MedievalSharp,serif;font-weight:400;font-size:17px;margin-top:6px;text-shadow:0 2px 6px #000}
.node .stars{font-size:16px;letter-spacing:2px}
.node .subj{font-size:11px;opacity:.8}
.legend{display:flex;justify-content:center;gap:14px;color:#fde9b0;font-size:14px;margin-top:8px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.legend .lm::before{background:#7fd6a0}.legend .ld::before{background:#b09cf0}
.pets{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.petopt{border:3px solid var(--edge);border-radius:14px;background:#fffdf5;padding:12px;text-align:center;cursor:pointer;font-weight:800}
.petopt span{display:block;font-size:44px}
.petopt.sel{border-color:#7a62b5;background:#efe7ff}
.speech{display:flex;gap:10px;align-items:flex-start}
.speech .p{font-size:40px;line-height:1}
.speech .bubble{background:#fffdf5;border:2px solid var(--edge);border-radius:14px;padding:10px 12px;flex:1;font-size:16px}
.bigstars{font-size:46px;text-align:center;letter-spacing:6px;margin:6px 0}
.timer{font-weight:900;color:#7a2e0b}
.stat{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed var(--edge);font-size:16px}
.stat .mini{width:90px;height:8px;background:#0000001a;border-radius:5px;overflow:hidden;margin-left:8px}
.stat .mini span{display:block;height:100%;background:var(--ok)}
.review{border-top:1px dashed var(--edge);padding:10px 0;font-size:15px}
.spark{position:fixed;pointer-events:none;z-index:50;font-size:22px;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
.modal{position:fixed;inset:0;background:#000a;z-index:80;display:grid;place-items:center;padding:16px}
.modal .card{max-width:420px;width:100%}
.cert{text-align:center;border:6px double #a87a2a}
.cert .big{font-size:64px}
.small{font-size:14px;color:#6b4a1f}
a{color:#4b3690}
.fsgame,.fsgame *{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important;-webkit-tap-highlight-color:transparent}
.fsgame canvas{-webkit-user-drag:none}

.fsgame{position:fixed;inset:0;z-index:60;background:#140d33;touch-action:none;-webkit-user-select:none;user-select:none;display:flex;flex-direction:column;overscroll-behavior:none}
.fshud{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;background:#0b0724;color:#fde9b0;font:800 18px Nunito,sans-serif}
.fshud small{font-size:13px;opacity:.8}
.fs-x{background:#ffffff22;border:none;color:#fde9b0;font-size:20px;width:40px;height:40px;border-radius:50%;cursor:pointer;flex:0 0 auto}
.fsarea{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 0%,#5b3fa8,#2a1b5e 55%,#140d33)}
.fsarea .gcanvas{border-radius:0;box-shadow:none;position:absolute;inset:0}
.fsarea .ftime,.gmsg{color:#fde9b0;font:800 18px Nunito,sans-serif;margin-bottom:12px;text-align:center;min-height:26px;padding:0 10px}
.gnote{color:#fde9b0cc;font-size:14px;margin-top:12px;text-align:center;padding:0 12px}
.simon{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px}
.spad{border:none;border-radius:26px;background:var(--c);opacity:.5;box-shadow:0 6px 0 #0006;transition:opacity .1s,transform .1s;cursor:pointer}
.spad.lit{opacity:1;transform:scale(1.04);box-shadow:0 0 34px var(--c)}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px}
.tcell{border:none;border-radius:16px;background:#fff8e6;box-shadow:0 4px 0 #c9a35c;cursor:pointer;padding:0}
.puz{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px}
.ptile{border:none;border-radius:16px;font-family:Nunito,sans-serif;font-weight:900;color:#fff;background:linear-gradient(135deg,hsl(var(--h),70%,65%),hsl(var(--h),60%,42%));box-shadow:0 4px 0 #0006;text-shadow:0 2px 4px #0006;cursor:pointer}
.pempty{border-radius:16px;background:#ffffff14}



.hcalc{display:flex;flex-direction:column;gap:8px;align-items:center}
.hrow{display:flex;align-items:center;gap:5px}
.hrow span{font-weight:900;font-size:20px;color:#5a2d0c;min-width:12px;text-align:center}
.hn{width:64px;height:44px;font:800 21px Nunito,sans-serif;text-align:center;border:2px solid #dcc597;border-radius:8px;background:#fff;color:var(--ink);padding:0}
.hn.sm{width:44px}.hn:focus{outline:none;border-color:#7a62b5;box-shadow:0 0 0 3px #7a62b533}
.hrow.main .hn{border-color:#c9a35c}.hn.ok{border-color:var(--ok);background:#e6f7ec}.hn.bad{border-color:var(--bad);background:#fde3e0}
.hrow .hb{min-width:30px}
.hsep{font-size:13px;font-weight:800;color:#8a6a3a;border-top:3px solid #5a2d0c;padding-top:6px;width:100%;max-width:320px;text-align:center}

.garea{display:flex;flex-direction:column;align-items:center;width:100%}
.gcanvas{display:block;border-radius:12px;touch-action:none;box-shadow:0 4px 14px #0006;max-width:100%;-webkit-user-select:none;user-select:none}
.dpad{display:grid;grid-template-columns:repeat(3,68px);grid-template-rows:repeat(2,54px);gap:6px;margin-top:10px;touch-action:none}
.dpad button{font-size:24px;border-radius:14px;border:none;background:linear-gradient(#efe4ff,#c9b6f2);box-shadow:0 3px 0 #7a62b5;color:#2a1b5e}
.dpad [data-d="0,-1"]{grid-column:2;grid-row:1}.dpad [data-d="-1,0"]{grid-column:1;grid-row:2}.dpad [data-d="0,1"]{grid-column:2;grid-row:2}.dpad [data-d="1,0"]{grid-column:3;grid-row:2}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mcard{aspect-ratio:1;border-radius:12px;border:3px solid #c9a35c;background:linear-gradient(135deg,#7a62b5,#4b3690);font-size:34px;cursor:pointer;padding:0;transition:background .15s}
.mcard span{opacity:0;transition:opacity .15s}.mcard.up{background:#fffdf5}.mcard.up span{opacity:1}.mcard.done{background:#dff5e6;border-color:#2f9e57}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hole{aspect-ratio:1;border-radius:50%;border:none;background:radial-gradient(circle at 50% 62%,#2b1d0e 0 42%,#6b4423 43% 58%,#8fbf6a 59%);overflow:hidden;cursor:pointer;padding:0}
.hole span{display:inline-block;transform:translateY(70%) scale(.4);opacity:0;transition:transform .12s,opacity .12s}
.hole.up span{transform:none;opacity:1}.hole.gold{box-shadow:0 0 0 4px #f3c45a,0 0 22px #f3c45a}.hole.gold span{filter:sepia(1) saturate(4) hue-rotate(5deg)}
.hole.hit{background:radial-gradient(circle,#fff 0 30%,#f3c45a 31% 58%,#8fbf6a 59%)}
.ftime{font-size:18px;font-weight:800;margin-bottom:8px}
.gres{text-align:center;padding:10px;width:100%}.gres h2{margin:4px 0}
.card.game{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center}
.card.game .gicon{font-size:44px;text-align:center}.card.game h3{margin:0 0 4px;font-size:20px;color:#5a2d0c}.card.game .btn{grid-column:1 / -1}
.arc-stat{display:flex;justify-content:space-around;margin-top:10px;font-size:17px;flex-wrap:wrap;gap:6px}

.tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tbtn{font:800 15px Nunito,sans-serif;padding:8px 12px;border-radius:20px;border:2px solid var(--edge);background:#fffdf5;color:#5a2d0c;cursor:pointer}
.tbtn.on{background:#5a2d0c;color:#fde9b0;border-color:#5a2d0c}
.toolbox{margin-top:10px;background:#fffdf5;border:2px dashed var(--edge);border-radius:14px;padding:12px}
.calc{display:grid;grid-template-columns:34px repeat(6,40px);gap:4px;justify-content:center;align-items:center}
.calc .ph{font-size:12px;font-weight:800;color:#8a6a3a;text-align:center}
.calc .lbl{font-weight:900;font-size:20px;text-align:center;color:#5a2d0c}
.cc{width:40px;height:46px;text-align:center;font:800 24px Nunito,sans-serif;border:2px solid #dcc597;border-radius:8px;background:#fff;color:var(--ink);padding:0;
  background-image:linear-gradient(#e8eef8 1px,transparent 1px);background-size:100% 23px}
.cc:focus{outline:none;border-color:#7a62b5;box-shadow:0 0 0 3px #7a62b533}
.cc.carry{height:28px;font-size:15px;color:#c8463b;border-style:dashed}
.cc.res{border-color:#c9a35c}
.cc.ok{border-color:var(--ok);background:#e6f7ec}.cc.bad{border-color:var(--bad);background:#fde3e0}
.calc .line{grid-column:1 / -1;height:0;border-top:3px solid #5a2d0c;margin:2px 0}
.opbtn{width:34px;height:40px;font:900 24px Nunito,sans-serif;border-radius:8px;border:2px solid #7a62b5;background:#efe7ff;color:#2a1b5e;cursor:pointer;padding:0}
.pad{display:block;width:100%;height:300px;border:2px solid var(--edge);border-radius:12px;touch-action:none;background-color:#fff;background-image:linear-gradient(#d6e4f5 1px,transparent 1px),linear-gradient(90deg,#d6e4f5 1px,transparent 1px);background-size:22px 22px;cursor:crosshair}
input.ans.flash{animation:flash .9s}
@keyframes flash{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 6px #f3c45a}}

</style>

<body>
<div id="sky"><div class="moon"></div></div>
<div class="wrap" id="app"></div>

<script id="core">
/* ============ Hilfsfunktionen ============ */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const eur=c=>(c/100).toFixed(2).replace('.',',')+' €';
const pad=n=>String(n).padStart(2,'0');
const tm=m=>`${Math.floor(m/60)}:${pad(m%60)} Uhr`;
const minus='−';
function steps(a,b,op){let cur=a;const out=[];const parts=[Math.floor(b/100)*100,Math.floor(b%100/10)*10,b%10];
  for(const p of parts){if(!p)continue;const n=op==='+'?cur+p:cur-p;out.push(`${cur} ${op==='+'?'+':minus} ${p} = ${n}`);cur=n;}return out.join('<br>');}
function choice(q,correct,wrongs,extra){const opts=shuffle([correct,...wrongs]);return Object.assign({type:'choice',q,options:opts,answer:opts.indexOf(correct)},extra);}

/* ============ Prüfen ============ */
function normText(s){return String(s??'').trim().replace(/\s+/g,' ').replace(/[.!?,;:]+$/,'').toLowerCase();}
function stripArt(s){return s.replace(/^(der|die|das|den|dem|ein|eine|am) /,'');}
function parseNum(s){s=String(s??'').replace(/\s/g,'').replace(/[^\d,.\-]/g,'');
  if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');s=s.replace(',','.');if(s===''||isNaN(s))return NaN;return parseFloat(s);}
function parseTime(s){const m=String(s??'').match(/(\d{1,2})\s*[:.,h ]\s*(\d{2})/);return m?(+m[1])*60+(+m[2]):NaN;}
function checkField(f,val){
  if(f.type==='num')return Math.abs(parseNum(val)-f.answer)<0.001;
  if(f.type==='time')return parseTime(val)===f.answer;
  const acc=[f.answer,...(f.accept||[])];
  if(f.cs)return acc.some(a=>String(val??'').trim().replace(/[.!?]+$/,'')===a);
  const v=stripArt(normText(val));return acc.some(a=>stripArt(normText(a))===v);}
function check(t,resp){
  if(t.type==='choice')return resp===t.answer;
  if(t.type==='tap'){const a=[...(resp||[])].sort((x,y)=>x-y).join(),b=[...t.answer].sort((x,y)=>x-y).join();return a===b;}
  if(t.type==='multi')return t.fields.every((f,i)=>checkField(f,(resp||[])[i]));
  return checkField(t,resp);}
function emptyResp(t,resp){
  if(t.type==='choice')return resp==null;
  if(t.type==='tap')return !resp||!resp.length;
  if(t.type==='multi')return !resp||resp.some(v=>!String(v??'').trim());
  return !String(resp??'').trim();}

/* ============ Grafiken ============ */
function svgNumberLine(n,labels){ // n Teilstriche, labels {index:text}
  const W=330,x0=20,x1=W-20,step=(x1-x0)/(n-1);let s=`<svg class="fig" width="${W}" height="70" viewBox="0 0 ${W} 70"><line x1="8" y1="30" x2="${W-8}" y2="30" stroke="#5a2d0c" stroke-width="3"/><path d="M${W-8} 30 l-9 -6 v12z" fill="#5a2d0c"/>`;
  for(let i=0;i<n;i++){const x=x0+i*step;s+=`<line x1="${x}" y1="20" x2="${x}" y2="40" stroke="#5a2d0c" stroke-width="${labels[i]?3:2}"/>`;if(labels[i])s+=`<text x="${x}" y="62" text-anchor="middle" font-size="16" font-weight="800" fill="#5a2d0c">${labels[i]}</text>`;}
  return s+'</svg>';}
function svgBars(cats,vals){const W=330,H=210,l=34,b=170,top=20,max=10,bw=46,gap=(W-l-10-cats.length*bw)/(cats.length);
  let s=`<svg class="fig" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  for(let v=0;v<=max;v++){const y=b-(b-top)*v/max;s+=`<line x1="${l}" y1="${y}" x2="${W-6}" y2="${y}" stroke="#c9a35c" stroke-width="${v%2?0.7:1.4}"/>`;if(v%2===0)s+=`<text x="${l-6}" y="${y+5}" text-anchor="end" font-size="13" fill="#5a2d0c">${v}</text>`;}
  const col=['#7fd6a0','#b09cf0','#f3c45a','#f08a7a'];
  cats.forEach((c,i)=>{const x=l+gap/2+i*(bw+gap),h=(b-top)*vals[i]/max;s+=`<rect x="${x}" y="${b-h}" width="${bw}" height="${h}" rx="4" fill="${col[i]}" stroke="#5a2d0c" stroke-width="1.5"/><text x="${x+bw/2}" y="${b+18}" text-anchor="middle" font-size="12" font-weight="800" fill="#5a2d0c">${c}</text>`;});

  const sq=(c,r,n)=>`<rect x="${10+c*z}" y="${10+r*z}" width="${z}" height="${z}" fill="#fffdf5" stroke="#5a2d0c" stroke-width="2.5"/><text x="${10+c*z+z/2}" y="${10+r*z+z/2+8}" text-anchor="middle" font-size="24" font-weight="900" fill="#5a2d0c">${n}</text>`;
  s+=sq(tc,0,top);row.forEach((n,i)=>s+=sq(i,1,n));s+=sq(bc,2,bottom);return s+'</svg>';}
function svgWall(){const z=60,W=z*3+20;let s=`<svg class="fig" width="${W}" height="${z*1.5+20}" viewBox="0 0 ${W} ${z*1.5+20}">`;

'Plus und Minus':{ask:'Rechne in Schritten: Zerlege die zweite Zahl in Hunderter, Zehner und Einer.',learn:'<b>Schrittweise rechnen:</b> Zerlege die zweite Zahl.<br>3456 + 238: 3456 + 200 = 3656 → + 30 = 3686 → + 8 = <b>3694</b><br><br><b>Entbündeln beim Minus:</b> Bei 52 − 7 reichen 2 Einer nicht. Tausche 1 Zehner in 10 Einer: 12 − 7 = 5, übrig bleiben 4 Zehner → <b>45</b>.<br>Steht an der Zehnerstelle eine 0 (z. B. 403 − 8), holst du dir zuerst einen Hunderter: 403 = 39 Zehner und 13 Einer → 13 − 8 = 5 → <b>395</b>.'},
'Stellenwerte':{ask:'Hast du gebündelt? 10 Zehner sind 1 Hunderter, 10 Einer sind 1 Zehner.',learn:'<b>Stellenwerttafel:</b> T | H | Z | E<br>10 E = 1 Z · 10 Z = 1 H · 10 H = 1 T<br><br>Beispiel: 3 H, 12 Z, 4 E → 12 Z = 1 H und 2 Z → 4 H, 2 Z, 4 E = <b>424</b><br><br><b>Nachbarzehner</b> enden auf 0: 467 liegt zwischen <b>460</b> und <b>470</b>.<br><b>Nachbarhunderter</b> enden auf 00: 467 liegt zwischen <b>400</b> und <b>500</b>.'},
'Zahlenstrahl':{ask:'Wie groß ist ein einziger Abschnitt? Rechne zuerst den Abstand der beiden Zahlen aus.',learn:'<b>Abstand : Anzahl der Abschnitte = ein Abschnitt</b><br><br>Beispiel: 100 und 500 mit 4 Abschnitten: 500 − 100 = 400, 400 : 4 = 100.<br>Die Striche heißen dann: 100, 200, 300, 400, 500. Die Mitte ist bei <b>300</b>.<br>Nach links wird es kleiner, nach rechts größer.'},
'Mal und Geteilt':{ask:'Zerlege die große Zahl in Teile, mit denen du leicht rechnen kannst.',learn:'<b>Halbschriftlich teilen:</b> 190 : 8<br>→ 160 : 8 = 20 (eine Zahl, die gut aufgeht)<br>→ 30 : 8 = 3 R 6<br>→ zusammen: 190 : 8 = <b>23 R 6</b><br><b>Teilen mit Rest:</b> 39 : 8 = 4 R 7, denn 4 · 8 = 32 und bis 39 fehlen 7.<br><br><b>Zerlegen:</b> 7 · 24 = 7 · 20 + 7 · 4 = 140 + 28 = <b>168</b><br><b>Geteilt:</b> 168 : 7 → 140 : 7 = 20 und 28 : 7 = 4 → <b>24</b><br>Probe: 24 · 7 = 168 ✓<br><br>„Das <b>Dreifache</b> von 40“ heißt 3 · 40 = 120.'},
'Geschickt rechnen':{ask:'Kannst du mit einer runden Zahl rechnen und danach ausgleichen?',learn:'<b>Minus 99 ist fast minus 100:</b><br>345 − 99 → 345 − 100 = 245. Du hast 1 zu viel abgezogen, also wieder dazu: 245 + 1 = <b>246</b>.<br><br><b>Halbieren und Verdoppeln:</b><br>18 · 5 = 9 · 10 = <b>90</b>. Die eine Zahl halb, die andere doppelt, das Ergebnis bleibt gleich.'},
'Sachaufgaben':{ask:'Was weißt du? Was ist gesucht? Kommt etwas dazu oder geht etwas weg?',learn:'<b>So knackst du Sachaufgaben:</b><br>1. Lies die Aufgabe zweimal.<br>2. Was ist gegeben? Was ist gefragt?<br>3. Ganze Strecke − schon geschafft = Rest.<br><br>Beispiel: Weg 500 km, gefahren 320 km → 500 − 320 = <b>180 km</b>.<br>Denk an die Einheit (km, €, Minuten).'},
'Geld':{ask:'Musst du in zwei Schritten rechnen? Erst die Kosten, dann das Rückgeld?',learn:'<b>Zwei Schritte:</b><br>1. Kosten: 5 Kugeln zu je 1,60 € → 5 · 160 ct = 800 ct = 8,00 €<br>2. Rückgeld: bezahlt − Kosten → 20,00 € − 8,00 € = <b>12,00 €</b><br><br>Tipp: Rechne in Cent, wenn dich das Komma stört. 1 € = 100 ct.'},
'Kombinieren':{ask:'Wie viele Möglichkeiten gibt es beim Ersten? Und zu jeder davon beim Zweiten?',learn:'<b>Malnehmen statt Abzählen:</b><br>2 Hosen und 3 T-Shirts: Zu jeder Hose passen 3 T-Shirts → 2 · 3 = <b>6</b>.<br>Kommen noch 2 Mützen dazu: 6 · 2 = <b>12</b>.<br>Ein Baumdiagramm zeigt dir alle Wege.'},
'Diagramme':{ask:'Wie hoch ist jede Säule genau? Folge mit dem Finger der Linie zur Zahl links.',learn:'<b>Diagramm lesen:</b> Fahre von der Säulenspitze waagerecht zur Achse. Liegt sie zwischen 4 und 6, ist es 5.<br><b>Insgesamt</b> heißt: alle Säulen zusammenzählen.<br>Wechseln Kinder von einer Säule zur anderen, wird die eine kleiner und die andere größer.'},
'Zeit':{ask:'Wie viele Minuten sind es bis zur nächsten vollen Stunde?',learn:'<b>1 Stunde = 60 Minuten</b>, nicht 100!<br><br><b>Zeitspanne mit Zwischenstopp:</b><br>9:45 bis 10:20 → bis 10:00 sind es 15 min, dann noch 20 min → <b>35 min</b><br><br><b>Endzeit:</b> 9:45 + 30 min → 15 min bis 10:00, Rest 15 min → <b>10:15 Uhr</b>'},
'Größen':{ask:'In welche Einheit musst du umrechnen? Wie viele kleine passen in eine große?',learn:'1 m = 100 cm · 1 km = 1000 m · 1 kg = 1000 g · 1 cm = 10 mm · 1 h = 60 min<br><br><b>Achtung:</b> 3 m 5 cm = <b>305 cm</b> (nicht 35 und nicht 350)!<br>Erst in gleiche Einheiten umrechnen, dann rechnen: 2,40 m = 240 cm.'},
'Muster und Folgen':{ask:'Was passiert von einer Zahl zur nächsten? Schreib über jeden Sprung + oder − und die Zahl.',learn:'<b>Beispiel:</b> 10, 30, 20, 40, 30<br>+20, −10, +20, −10 → zwei Regeln wechseln sich ab. Nächste Zahl: 30 + 20 = <b>50</b>.<br><br><b>Rechenpäckchen:</b> Wird die erste Zahl um 10 größer und die zweite um 1 kleiner, wird das Ergebnis um 10 − 1 = <b>9</b> größer.'},
'Zahlenmauern':{ask:'Welcher Stein unten wird zweimal benutzt?',learn:'Zwei Steine nebeneinander werden <b>addiert</b>, das Ergebnis steht darüber.<br>Unten 10, 30, 20 → 10 + 30 = 40 und 30 + 20 = 50 → oben 40 + 50 = <b>90</b>.<br>Der <b>mittlere Stein zählt doppelt</b>. Für den größten Deckstein: größte Zahl in die Mitte. Für den kleinsten: kleinste Zahl in die Mitte.'},
'Knobeln':{ask:'Probiere eine Lösung aus und prüfe beide Hinweise. Was musst du verändern?',learn:'<b>Summe 30, Unterschied 10:</b><br>Starte mit der Hälfte: 15 und 15, der Unterschied ist 0.<br>Eine Zahl + 5, die andere − 5 → 20 und 10: Summe 30 ✓, Unterschied 10 ✓<br><br>Trick: (Summe + Unterschied) : 2 = größere Zahl.'},
'Wahrscheinlichkeit':{ask:'Kann auch etwas anderes herauskommen? Kann es überhaupt passieren?',learn:'<b>sicher</b>: passiert immer (nur rote Kugeln → sicher rot)<br><b>unmöglich</b>: passiert nie (keine rote → unmöglich rot)<br><b>möglich</b>: kann passieren, muss aber nicht (rote und blaue)'},
'Raum und Form':{ask:'Gegenüberliegende Flächen berühren sich beim Falten nie. Welche Felder haben eins dazwischen?',learn:'<b>Kreuz-Netz:</b> In der Reihe aus 4 Feldern liegt das 1. dem 3. gegenüber und das 2. dem 4.<br>Das Feld oben und das Feld unten liegen sich gegenüber.<br>Tipp: Zeichne ein Netz auf Papier, schneide es aus und falte es!'},
'Wortfamilie':{ask:'Welcher Teil bleibt in allen Wörtern gleich? Streiche Vorsilben und Endungen weg.',learn:'<b>Wortstamm:</b> fahren, der Fahrer, die Abfahrt → <b>fahr</b><br><br><b>Wortfamilie mit Wortarten:</b><br>die Freude (Nomen) – sich freuen (Verb) – freudig (Adjektiv)<br>Nomen haben einen Begleiter. Verben in der Grundform enden auf -en oder -n.'},
'Zusammengesetzte Nomen':{ask:'Welches Wort steht hinten? Es bestimmt den Begleiter.',learn:'die Haustür = das Haus + die <b>Tür</b><br>Das hintere Wort ist das <b>Grundwort</b> (Tür), es bestimmt den Begleiter (die).<br>Das vordere ist das <b>Bestimmungswort</b> (Haus). Es sagt, welche Tür gemeint ist.'},
'Wortarten':{ask:'Kannst du der, die oder das davorsetzen? Kann man es tun? Sagt es, wie etwas ist?',learn:'<b>Nomen:</b> der/die/das passt davor, großgeschrieben (Baum, Freude). Typische Endungen: -heit, -keit, -ung, -schaft, -nis<br><b>Verben:</b> was jemand tut (laufen, liest)<br><b>Adjektive:</b> wie etwas ist (groß, mutig), man kann sie steigern<br>Mit Begleiter wird ein Verb zum Nomen: <b>das</b> Laufen'},
'Rechtschreibung':{ask:'Kannst du das Wort verlängern oder ein verwandtes Wort finden?',learn:'<b>Verlängern</b> bei d/t, b/p, g/k am Ende: Hun? → die Hunde → <b>Hund</b><br><b>Ableiten</b> bei ä/äu: Häuser ← Haus, Hände ← Hand. Gibt es kein Wort mit a/au → e oder eu (Berge, Freunde).<br><b>ss oder ß:</b> nach kurzem Laut ss (Fluss), nach langem Laut oder ei/au ß (Fuß, heiß).'},
'Großschreibung':{ask:'Welches Wort steht am Satzanfang? Vor welche Wörter passt der, die oder das?',learn:'<b>Groß schreibt man:</b><br>• den Satzanfang<br>• Nomen (der Baum, die Freude)<br>• Namen (Lina)<br>Probe: Passt der, die, das oder ein davor? Dann groß.<br>Adjektive (bunte) und Verben (wachsen) bleiben klein.'},
'Zeitformen':{ask:'Ist es jetzt, früher oder später? Aus wie vielen Teilen besteht das Verb?',learn:'<b>Präsens</b>: ich spiele (jetzt)<br><b>Präteritum</b>: ich spielte, ich ging (ein Wort, wie im Märchen)<br><b>Perfekt</b>: ich habe gespielt, ich bin gegangen (zwei Teile)<br><b>Futur</b>: ich werde spielen (Zukunft)'},
'Satzglieder':{ask:'Welche Wörter bleiben beim Umstellen zusammen?',learn:'<b>Umstellprobe:</b><br>Der kleine Hund | bellt | laut.<br>Laut | bellt | der kleine Hund.<br>Was zusammenbleibt, ist ein Satzglied.<br>Das <b>Prädikat</b> (gebeugtes Verb) steht im Aussagesatz an 2. Stelle. Frage: Was tut jemand?'},
'Wörtliche Rede':{ask:'Steht der Begleitsatz vorne oder hinten?',learn:'<b>Vorne:</b> Mia sagt: „Ich komme mit.“<br>→ Doppelpunkt, Satzzeichen innerhalb der Anführungszeichen<br><b>Hinten:</b> „Ich komme mit“, sagt Mia. · „Kommst du mit?“, fragt Mia.<br>→ Komma nach dem Schlusszeichen. Der Punkt fällt weg, ? und ! bleiben.'},
'Adjektive':{ask:'Ist das Adjektiv regelmäßig oder eine Ausnahme?',learn:'klein – kleiner – am kleinsten<br>Oft mit Umlaut: alt – älter – am ältesten<br><b>Ausnahmen merken:</b><br>gut – besser – am besten<br>viel – mehr – am meisten<br>gern – lieber – am liebsten'},
'Teilbarkeit':{ask:'Geht die Zahl ohne Rest auf? Probiere die Zahlen der Reihe nach.',learn:'<b>Teiler</b> sind Zahlen, durch die man ohne Rest teilen kann.<br>Teiler von 15: 15 : 1 = 15, 15 : 3 = 5, 15 : 5 = 3, 15 : 15 = 1<br>→ <b>1, 3, 5 und 15</b> (15 hat 4 Teiler)<br>Tipp: Teiler kommen in Paaren: 1 · 15 und 3 · 5.'},
'Lesen':{ask:'Welches wichtige Wort aus der Frage findest du im Text wieder?',learn:'<b>So findest du Antworten im Text:</b><br>1. Lies zuerst die Frage.<br>2. Suche ein Schlüsselwort der Frage im Text (z. B. „Flügel“).<br>3. Lies den Satz davor und danach genau.<br>Bei Überschriften: Welche passt zum <b>ganzen</b> Text, nicht nur zu einem Satz?'}
};
/* typische Fehler: Ergebnis, das beim Entbündeln-Fehler entsteht */
function digitAbsDiff(a,b){const A=String(a),B=String(b).padStart(A.length,'0');let r='';for(let i=0;i<A.length;i++)r+=Math.abs(+A[i]-+B[i]);return +r;}

/* ============ Regionen ============ */
const REGIONS=[
{id:'wald',name:'Zahlenwald',icon:'🌲',subj:'M',desc:'Stellenwerte, Zahlenstrahl, Plus und Minus',intro:'Im Zahlenwald wachsen Zahlen an den Bäumen. Die Waldgeister brauchen deine Hilfe beim Zählen und Rechnen!',gens:['add','sub','buendeln','nachbar','strahl','schriftlich','div','restTeilen','teilenHalb']},
{id:'markt',name:'Zwergenmarkt',icon:'⚒️',subj:'M',desc:'Geld, Sachaufgaben, Tabellen, Diagramme',intro:'Auf dem Zwergenmarkt wird gehandelt, gezählt und verglichen. Zwergin Brumhild sucht eine kluge Rechenmeisterin!',gens:['rest','wechsel','familie','kombi','diagramm','malSach','teilenSach']},
{id:'turm',name:'Uhrturm der Zeitmagierin',icon:'🕰️',subj:'M',desc:'Uhrzeiten, Längen, Gewichte',intro:'Die Zeitmagierin hat die Uhren verzaubert. Nur wer mit Zeit und Größen rechnen kann, bringt sie wieder zum Ticken.',gens:['zeitspanne','endzeit','laengen','umrechnen','einheit']},
{id:'hoehle',name:'Rätselhöhle',icon:'💎',subj:'M',desc:'Muster, Zahlenmauern, Knobeln, Würfelnetze',intro:'Tief in der Höhle warten knifflige Rätsel. Löse sie und die Kristalle beginnen zu leuchten!',gens:['folgeAlt','folgeMal','regel','mauer','raetsel','wahr','muster','wuerfel','geschickt','geschicktMal','teiler']},
{id:'quelle',name:'Wortquelle',icon:'⛲',subj:'D',desc:'Wortstamm, Wortfamilien, zusammengesetzte Nomen',intro:'An der Wortquelle sprudeln Wörter und ihre Verwandten. Die Quellnymphe möchte, dass du die Familien wieder zusammenführst.',gens:['stamm','kompos','familie','nachsilbe','nomenVerb']},
{id:'bruecke',name:'Rechtschreib-Brücke',icon:'🌉',subj:'D',desc:'Verlängern, Ableiten, ss/ß, Großschreibung',intro:'Brückentroll Grumpel lässt nur hinüber, wer richtig schreibt. Zeig ihm deine Rechtschreib-Tricks!',gens:['verl','abl','ssz','sszStreit','gross','gross']},
{id:'burg',name:'Grammatik-Burg',icon:'🏰',subj:'D',desc:'Wortarten, Zeitformen, Satzglieder, wörtliche Rede',intro:'In der Grammatik-Burg herrscht Durcheinander. Bringe Wörter und Sätze wieder in Ordnung!',gens:['zeitform','verbform','praed','wortart','satzglieder','umstell','rede','steig']},
{id:'bib',name:'Bibliothek der Elfen',icon:'📚',subj:'D',desc:'Texte lesen und verstehen',intro:'In der Elfen-Bibliothek stehen magische Bücher. Lies genau, dann verraten sie dir ihre Geheimnisse.',gens:'lesen'}
];
function genFor(reg,n){if(reg.gens==='lesen'){let out=[];const used=new Set();while(out.length<n){let t;do{t=lesen();}while(used.has(t[0].q)&&used.size<TEXTE.length);used.add(t[0].q);out=out.concat(t);}return out.slice(0,n);}
  const g=shuffle(reg.gens);const out=[];for(let i=0;i<n;i++){const name=g[i%g.length];const t=runGen(name);t.region=reg.id;out.push(t);}return out;}
function genMixed(subj,n){const regs=REGIONS.filter(r=>!subj||r.subj===subj);const out=[];
  const lesenTasks=lesen();
  for(let i=0;i<n;i++){const r=regs[i%regs.length];if(r.gens==='lesen'){out.push(Object.assign(lesenTasks.shift()||lesen()[0],{region:r.id}));continue;}const t=runGen(pick(r.gens));t.region=r.id;out.push(t);}return shuffle(out);}
if(typeof module!=='undefined')module.exports={M,D,REGIONS,genFor,genMixed,lesen,check,TEXTE,LESSON,parseNum,POOLS,draw,markSolved,runGen,SEEN:()=>SEEN,poolStats};
</script>

<script>
/* ============ Spielzustand ============ */
const PETS=[{e:'🐉',n:'Funkel',t:'Drache'},{e:'🦉',n:'Fiora',t:'Eule'},{e:'🦄',n:'Sternchen',t:'Einhorn'},{e:'🦊',n:'Flammi',t:'Fuchs'}];
const LEVELS=[[0,'Lehrling'],[25,'Abenteurerin'],[60,'Heldin'],[120,'Zauber-Meisterin'],[200,'Kompass-Legende'],[350,'Hüterin des Reiches']];
const KEY='kompassQuest_v1';
let S;try{S=JSON.parse(localStorage.getItem(KEY))||null;}catch(e){S=null;}
if(!S)S={name:'',pet:0,gems:0,regions:{},stats:{},streak:0,lastDay:'',finalDone:false,probes:[],mistakes:{}};
if(!S.mistakes)S.mistakes={};
if(!S.seen)S.seen={};SEEN=S.seen;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const $=s=>document.querySelector(s);const app=$('#app');
const pet=()=>PETS[S.pet]||PETS[0];
function level(){let cur=LEVELS[0],next=null;for(let i=0;i<LEVELS.length;i++){if(S.gems>=LEVELS[i][0]){cur=LEVELS[i];next=LEVELS[i+1]||null;}}return{cur,next};}
function today(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function touchStreak(){const t=today();if(S.lastDay===t)return;const y=new Date();y.setDate(y.getDate()-1);const ys=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();S.streak=S.lastDay===ys?S.streak+1:1;S.lastDay=t;save();}
function splinters(){return REGIONS.filter(r=>(S.regions[r.id]?.stars||0)>=1).length;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* Sterne am Himmel */
(function(){const sky=$('#sky');for(let i=0;i<70;i++){const s=document.createElement('i');s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=(Math.random()*3)+'s';if(Math.random()<.2){s.style.width=s.style.height='3px';}sky.appendChild(s);}})();

function topbar(){const {cur,next}=level();const pct=next?Math.round((S.gems-cur[0])/(next[0]-cur[0])*100):100;
  return `<div class="top"><div class="pet">${pet().e}</div><div class="who"><b>${esc(S.name||'Heldin')} · ${cur[1]}</b><div class="bar"><span style="width:${pct}%"></span></div><small>${next?`Noch ${next[0]-S.gems} Erfahrung bis „${next[1]}“`:'Höchste Stufe erreicht!'}${S.streak>1?` · 🔥 ${S.streak} Tage`:''}</small></div><div class="gems">💎 ${wallet()}</div><button class="iconbtn" onclick="showMap()" aria-label="Karte">🗺️</button></div>`;}

function sparkle(x,y,n=14){const em=['✨','💎','⭐','🌟'];for(let i=0;i<n;i++){const s=document.createElement('div');s.className='spark';s.textContent=em[i%em.length];s.style.left=x+'px';s.style.top=y+'px';const a=Math.random()*Math.PI*2,d=60+Math.random()*90;s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1000);}}

/* ============ Start ============ */
function showStart(){let sel=S.pet;app.innerHTML=`<div class="lead"><h1>Kompass-Quest</h1><div>Das Abenteuer im Reich Kompassia</div></div>
<div class="card"><h2>Willkommen, junge Heldin!</h2><p class="q">Der magische Kompass des Reiches ist in acht Splitter zerbrochen. Nur wer Rätsel aus <b>Mathe</b> und <b>Deutsch</b> löst, kann ihn wieder zusammensetzen.</p>
<label class="q"><b>Wie heißt du?</b></label><input class="ans" id="nm" value="${esc(S.name||'Pauline')}" maxlength="20" autocomplete="off">
<p class="q" style="margin-top:14px"><b>Wähle deinen Begleiter:</b></p><div class="pets">${PETS.map((p,i)=>`<div class="petopt ${i===sel?'sel':''}" data-i="${i}"><span>${p.e}</span>${p.n} <small>(${p.t})</small></div>`).join('')}</div>
<div class="row"><button class="btn wide" id="go">Abenteuer beginnen ✨</button></div></div>`;
  app.querySelectorAll('.petopt').forEach(el=>el.onclick=()=>{sel=+el.dataset.i;app.querySelectorAll('.petopt').forEach(x=>x.classList.toggle('sel',+x.dataset.i===sel));});
  $('#go').onclick=()=>{S.name=$('#nm').value.trim()||'Pauline';S.pet=sel;save();showMap();};}

/* ============ Karte ============ */
function showMap(){leaveGame();if(!S.name)return showStart();window.scrollTo(0,0);const nodes=[...REGIONS,{id:'final',name:'Turm des Großen Kompass',icon:'🧭',final:true}];
  const xs=[28,72,30,70,28,72,30,70,50],gapY=150,H=nodes.length*gapY+20;const sp=splinters(),unlocked=sp>=8;
  const pts=nodes.map((n,i)=>[xs[i],i*gapY+50]);
  let path=`M${pts[0][0]} ${pts[0][1]}`;for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i];path+=` C${x0} ${y0+gapY/2}, ${x1} ${y1-gapY/2}, ${x1} ${y1}`;}
  app.innerHTML=topbar()+`<div class="lead"><h1 style="font-size:30px">Das Reich Kompassia</h1><div>Kompass-Splitter: <b>${sp} / 8</b> ${'🔷'.repeat(sp)}${'▫️'.repeat(8-sp)}</div></div>
<div class="row" style="margin-top:10px"><button class="btn sec wide" onclick="showArcade()">🎮 Zauber-Arkade${(S.playMs||0)>0?' · ⏳ '+fmtMs(S.playMs):' · 💎 '+wallet()}</button></div>
<div class="legend"><span class="lm">Mathe</span><span class="ld">Deutsch</span></div>
<div class="map" style="height:${H}px"><svg class="path" viewBox="0 0 100 ${H}" preserveAspectRatio="none"><path d="${path}" fill="none" stroke="#fde9b0" stroke-opacity=".55" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>
${nodes.map((n,i)=>{const st=S.regions[n.id]?.stars||0;const cls=n.final?('final'+(unlocked?'':' locked')):(n.subj==='M'?'m':'d');
  return `<div class="node ${cls}" style="left:${xs[i]}%;top:${i*gapY+8}px" data-id="${n.id}"><div class="disc">${n.final&&!unlocked?'🔒':n.icon}</div><b>${n.name}</b>${n.final?`<div class="subj">${unlocked?(S.finalDone?'⭐ bezwungen!':'Bereit für die letzte Prüfung!'):'Sammle alle 8 Splitter'}</div>`:`<div class="stars">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</div><div class="subj">${questSaved(n.id)?`▶ angefangen (${Math.min(questSaved(n.id).res.length+1,questSaved(n.id).n)}/${questSaved(n.id).n})`:(n.subj==='M'?'Mathe':'Deutsch')}</div>`}</div>`;}).join('')}</div>
${healCount()?`<div class="card"><h2>🌿 Quelle der Wiederholung</h2><div class="speech"><div class="p">${pet().e}</div><div class="bubble">Hier warten <b>${healCount()} Aufgabenarten</b>, bei denen du noch gestolpert bist. Wer sie hier löst, macht sie für immer zu seinen Stärken!</div></div><div class="row"><button class="btn wide" onclick="startQuest('heal')">Stolpersteine üben 🌿</button></div></div>`:''}
<div class="card"><h2>🎓 Probe-Kompass</h2><p class="q">Wie im echten Test: 11 Aufgaben, 30 Minuten, keine Tipps. Am Ende siehst du alle Lösungen.</p><div class="row"><button class="btn sec" onclick="startQuest('probeM')">Mathe-Probe</button><button class="btn sec" onclick="startQuest('probeD')">Deutsch-Probe</button></div></div>
<div class="row"><button class="btn ghost wide" style="color:#fde9b0;border-color:#fde9b088" onclick="showParents()">👪 Für Eltern: Fortschritt ansehen</button></div>`;
  app.querySelectorAll('.node').forEach(el=>el.onclick=()=>{const id=el.dataset.id;if(id==='final'){if(!unlocked)return toast(`${pet().n}: „Der Turm ist noch verschlossen. Sammle zuerst alle 8 Splitter!“`);return startQuest('final');}showRegion(id);});}

function toast(msg){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card"><div class="speech"><div class="p">${pet().e}</div><div class="bubble">${msg}</div></div><div class="row"><button class="btn wide">OK</button></div></div>`;m.querySelector('button').onclick=()=>m.remove();m.onclick=e=>{if(e.target===m)m.remove();};document.body.appendChild(m);}

function showRegion(id){leaveGame();const r=REGIONS.find(x=>x.id===id);const st=S.regions[id]?.stars||0;window.scrollTo(0,0);
  app.innerHTML=topbar()+`<div class="card"><div style="font-size:60px;text-align:center">${r.icon}</div><h2 style="text-align:center">${r.name}</h2><p class="small" style="text-align:center">${r.subj==='M'?'Mathe':'Deutsch'} · ${r.desc}</p>
<div class="speech"><div class="p">${pet().e}</div><div class="bubble">${r.intro}</div></div>

${(()=>{const sv=questSaved(id);return sv?`<div class="speech" style="margin-top:8px"><div class="p">⏸️</div><div class="bubble">Du hast diese Quest angefangen und bist bei <b>Aufgabe ${Math.min(sv.res.length+1,sv.n)} von ${sv.n}</b>.</div></div><div class="row"><button class="btn wide" onclick="startQuest('${id}')">Weiter bei Aufgabe ${Math.min(sv.res.length+1,sv.n)} ▶</button></div>`:`<div class="row"><button class="btn wide" onclick="startQuest('${id}')">Quest starten ⚔️</button></div>`;})()}<div class="row"><button class="btn ghost wide" onclick="showMap()">Zurück zur Karte</button></div></div>`;}

/* ============ Quest ============ */
let Q=null;
const GEN=Object.assign({},M,D);
function makeTwin(t){if(!t.gen||t.gen==='lesen')return null;const n=runGen(t.gen);n.region=t.region;n.twin=true;return n;}
function genHeal(n){const names=Object.entries(S.mistakes||{}).filter(([k,v])=>v>0).map(([k])=>k);const out=[];
  for(let i=0;i<n&&names.length;i++){const g=names[i%names.length];if(g==='lesen'){const L=lesen();out.push(L[ri(0,L.length-1)]);continue;}const t=runGen(g);t.region=REGIONS.find(r=>Array.isArray(r.gens)&&r.gens.includes(g))?.id;out.push(t);}return shuffle(out);}
function healCount(){return Object.values(S.mistakes||{}).filter(v=>v>0).length;}
function addMistake(t){if(!t.gen)return;S.mistakes=S.mistakes||{};S.mistakes[t.gen]=Math.min(3,(S.mistakes[t.gen]||0)+1);}
function fixMistake(t){if(!t.gen||!S.mistakes||!S.mistakes[t.gen])return;S.mistakes[t.gen]--;if(S.mistakes[t.gen]<=0)delete S.mistakes[t.gen];}

function saveQuest(){if(!Q||Q.probe)return;S.quests=S.quests||{};S.quests[Q.kind]={title:Q.title,tasks:Q.tasks,n:Q.n,res:Q.res,twins:Q.twins};save();}
function questSaved(kind){const q=(S.quests||{})[kind];return q&&q.res.length<q.tasks.length?q:null;}
function startQuest(kind){leaveGame();touchStreak();
  const sv=/^probe/.test(kind)?null:questSaved(kind);
  if(sv){Q={kind,title:sv.title,tasks:sv.tasks,n:sv.n,i:sv.res.length,res:sv.res,att:0,probe:false,resp:[],twins:sv.twins||0,end:0,resumed:true};renderTask();return;}
  let tasks,title,probe=false;
  if(kind==='final'){tasks=genMixed(null,10);title='Turm des Großen Kompass';}
  else if(kind==='probeM'){tasks=genMixed('M',11);title='Probe-Kompass Mathe';probe=true;}
  else if(kind==='probeD'){tasks=genMixed('D',11);title='Probe-Kompass Deutsch';probe=true;}
  else if(kind==='heal'){tasks=genHeal(6);title='Quelle der Wiederholung';if(!tasks.length)return showMap();}
  else{const r=REGIONS.find(x=>x.id===kind);tasks=genFor(r,6);title=r.name;}
  Q={kind,title,tasks,n:tasks.length,i:0,res:[],att:0,probe,resp:[],twins:0,end:probe?Date.now()+30*60000:0};saveQuest();renderTask();}

function maxAttempts(t){if(t.type==='choice')return t.options.length<=2?1:2;return 3;}

function renderTask(){const t=Q.tasks[Q.i];Q.att=0;Q.help=0;Q.locked=false;Q.cur=t.type==='tap'?[]:t.type==='multi'?t.fields.map(()=>''):null;window.scrollTo(0,0);
  const prog=Q.tasks.map((x,k)=>{const r=Q.res[k];let c='';if(k===Q.i)c='cur';else if(r!=null)c=Q.probe?'cur':(r===2?'ok':r===1?'half':'no');return `<span class="${c}" ${x.twin?'style="max-width:18px"':''}></span>`;}).join('');
  let inp='';
  if(t.type==='choice')inp=`<div class="opts">${t.options.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('')}</div>`;
  else if(t.type==='tap')inp=`<div class="chips">${t.words.map((w,k)=>`<button class="chip" data-k="${k}">${w}</button>`).join('')}</div>`;
  else if(t.type==='multi')inp=t.fields.map((f,k)=>`<div class="field"><label>${f.label}</label><input class="ans" data-k="${k}" ${f.type==='num'?'inputmode="decimal"':'autocapitalize="off" autocorrect="off" spellcheck="false"'} autocomplete="off">${f.unit?`<span class="unit">${f.unit}</span>`:''}</div>`).join('');
  else inp=`<div class="field"><input class="ans" id="single" ${t.type==='num'||t.type==='time'?'inputmode="decimal"':'autocapitalize="off" autocorrect="off" spellcheck="false"'} placeholder="${t.placeholder||'Deine Antwort'}" autocomplete="off">${t.unit&&t.type!=='time'?`<span class="unit">${t.unit}</span>`:''}</div>`;
  const backNote=Q.resumed?`<div class="speech" style="margin:8px 0"><div class="p">${pet().e}</div><div class="bubble"><b>Willkommen zurück!</b> Du machst bei Aufgabe ${Math.min(Q.i+1,Q.n)} von ${Q.n} weiter.</div></div>`:'';Q.resumed=false;
  const twinNote=t.twin?`<div class="speech" style="margin:8px 0"><div class="p">${pet().e}</div><div class="bubble"><b>🔁 Übungsaufgabe:</b> Gleich nochmal so eine, mit neuen Zahlen. Jetzt weißt du, wie es geht!</div></div>`:'';
  app.innerHTML=topbar()+`<div class="card" id="tc"><div class="taskhead"><span>${Q.title}</span><span>${Q.probe?`<span class="timer" id="timer"></span>`:t.twin?'Übung':`Aufgabe ${Math.min(Q.i+1,Q.n)} / ${Q.n}`}</span></div><div class="progress">${prog}</div>
<div style="display:flex;justify-content:space-between;align-items:center"><span class="tag">${t.skill}</span><button class="iconbtn" id="spk" style="color:#5a2d0c" aria-label="Vorlesen" title="Vorlesen">🔊</button></div>${backNote}${twinNote}${!Q.probe&&t.story&&!t.twin?`<div class="story" style="margin-top:6px">${t.story}</div>`:'<div style="height:6px"></div>'}<div class="q" id="qtext">${t.q}</div>${isMath(t)?toolsHtml():''}${inp}
<div id="helpbox"></div><div class="fb" id="fb"></div><div class="row" id="acts"><button class="btn" id="chk">${Q.probe?'Antwort speichern':'Prüfen ✨'}</button>${Q.probe?'':`<button class="btn sec" id="hnt" style="flex:0 0 auto">💡 Hilfe</button>`}</div>
<div class="row"><button class="btn ghost wide" id="quit">${Q.probe?'Probe abbrechen':'⏸️ Pause – später weitermachen'}</button></div></div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(Q.locked||b.disabled)return;Q.cur=+b.dataset.k;app.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b));});
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{if(Q.locked)return;const k=+b.dataset.k;const i=Q.cur.indexOf(k);if(i>=0)Q.cur.splice(i,1);else Q.cur.push(k);b.classList.toggle('sel');});
  app.querySelectorAll('input.ans').forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter')$('#chk')?.click();}));
  $('#chk').onclick=onCheck;if($('#hnt'))$('#hnt').onclick=onHelp;$('#spk').onclick=()=>speak($('#qtext').innerText);
  $('#quit').onclick=()=>{if(Q.probe)return confirmBox('Willst du die Probe wirklich abbrechen? Die Probe wird dann nicht gewertet.',()=>{clearInterval(Q.timerId);stopSpeak();showMap();});
    saveQuest();stopSpeak();toast(`Pause! Dein Fortschritt ist gespeichert. Beim nächsten Mal machst du bei Aufgabe ${Math.min(Q.res.length+1,Q.n)} weiter.`);showMap();};
  initTools(t);if(Q.probe)startTimer();}

/* ---- Rechenkasten & Notizblock ---- */
const COLS=6,PLACE=['HT','ZT','T','H','Z','E'],OPS=['+','−','·',':'];
function isMath(t){return !!(t.gen&&M[t.gen])&&t.type!=='choice'&&t.type!=='tap';}
function toolsHtml(){return `<div class="tools"><button class="tbtn" id="tCalc">✏️ Schriftlich rechnen</button><button class="tbtn" id="tDraw">📝 Notizblock</button></div><div id="calcBox" class="toolbox" hidden></div><div id="drawBox" class="toolbox" hidden></div>`;}
const cellIn=(r,c,cls,lab)=>`<input class="cc ${cls}" data-r="${r}" data-c="${c}" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="${lab||''}">`;
const hIn=(k,sm)=>`<input class="hn${sm?' sm':''}" data-k="${k}" inputmode="numeric" maxlength="5" autocomplete="off">`;
function calcHtml(isDiv){let grid;
  if(!isDiv){const row=(r,cls,first)=>first+[...Array(COLS)].map((_,c)=>cellIn(r,c,cls,PLACE[c])).join('');
    grid=`<div class="calc"><div></div>${PLACE.map(p=>`<div class="ph">${p}</div>`).join('')}${row(0,'','<div></div>')}${row(1,'','<button class="opbtn" id="opb" title="Rechenzeichen wechseln">+</button>')}${row(2,'carry','<div class="lbl">Ü</div>')}<div class="line"></div>${row(3,'res','<div class="lbl">=</div>')}</div>
<p class="small" style="text-align:center;margin:6px 0 0">Zahlen stellengerecht eintragen. Das Ergebnis schreibst du von <b>rechts nach links</b>. Ü = Übertrag. Tippe auf das Rechenzeichen, um es zu wechseln.</p>`;}
  else{grid=`<div class="hcalc"><div class="hrow main"><button class="opbtn" id="opb" title="Rechenzeichen wechseln">:</button>${hIn('a')}<span>:</span>${hIn('b',1)}<span>=</span>${hIn('q')}<span>R</span>${hIn('r',1)}</div>
<div class="hsep">Zerlegen in Teilaufgaben</div>${[0,1,2].map(i=>`<div class="hrow part" data-row="${i}"><span style="width:34px"></span>${hIn('p'+i)}<span>:</span><span class="hb">?</span><span>=</span>${hIn('q'+i)}<span>R</span>${hIn('r'+i,1)}</div>`).join('')}</div>
<p class="small" style="text-align:center;margin:6px 0 0">Zerlege wie in deinem Heft: <b>190 : 8</b> → 160 : 8 = 20 und 30 : 8 = 3 R 6 → zusammen <b>23 R 6</b>. Bleibt nichts übrig, lass R leer.</p>${Q.probe?'':'<div class="row" style="margin-top:6px"><button class="btn ghost" id="cHow" style="padding:6px 12px;font-size:15px">💡 Wie zerlege ich?</button></div>'}`;}
  return grid+`<div class="row" style="margin-top:8px">${Q.probe?'':'<button class="btn sec" id="cChk">Stimmt meine Rechnung?</button>'}<button class="btn" id="cTake">Ergebnis übernehmen ⤵</button></div>
<div class="row" style="margin-top:6px"><button class="btn ghost" id="cClr" style="padding:8px 14px;font-size:15px">Rechenkasten leeren</button></div><div id="cMsg" class="fb"></div>`;}
const cells=r=>[...document.querySelectorAll(`.cc[data-r="${r}"]`)];
function setRow(r,n){const s=String(n),cs=cells(r);cs.forEach(x=>x.value='');for(let i=0;i<s.length&&i<cs.length;i++)cs[cs.length-s.length+i].value=s[i];}
function rowVal(r){const d=cells(r).map(x=>x.value);const f=d.findIndex(v=>v!=='');if(f<0)return null;let l=d.length-1;while(d[l]==='')l--;return parseInt(d.slice(f,l+1).map(v=>v===''?'0':v).join(''),10);}
const hEl=k=>document.querySelector(`.hn[data-k="${k}"]`);
function hv(k){const e=hEl(k);if(!e)return null;const v=e.value.replace(/\D/g,'');return v===''?null:parseInt(v,10);}
function hset(k,v){const e=hEl(k);if(e)e.value=v==null?'':v;}
function calcMsg(cls,html){const m=$('#cMsg');m.className='fb show '+cls;m.innerHTML=html;}
function firstPart(a,b){return Math.floor(a/(10*b))*10*b;}
function initCalc(t){let op=t.calc?Math.max(0,OPS.indexOf(t.calc.op)):0;
  const build=()=>{const isDiv=OPS[op]===':';$('#calcBox').innerHTML=calcHtml(isDiv);$('#opb').textContent=OPS[op];
    if(t.calc&&OPS.indexOf(t.calc.op)===op){if(isDiv){hset('a',t.calc.a);hset('b',t.calc.b);}else{setRow(0,t.calc.a);setRow(1,t.calc.b);}}
    bind(isDiv);};
  function bind(isDiv){
    $('#opb').onclick=()=>{const was=OPS[op]===':';op=(op+1)%OPS.length;if(was!==(OPS[op]===':'))build();else $('#opb').textContent=OPS[op];};
    document.querySelectorAll('.cc').forEach(el=>{
      el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'').slice(-1);el.classList.remove('ok','bad');if(!el.value)return;const r=el.dataset.r,c=+el.dataset.c,row=cells(r);
        if(r==='3'){if(c>0)row[c-1].focus();}else if(r!=='2'&&c<row.length-1)row[c+1].focus();});
      el.addEventListener('keydown',e=>{if(e.key!=='Backspace'||el.value)return;const r=el.dataset.r,c=+el.dataset.c,row=cells(r);const n=r==='3'?row[c+1]:row[c-1];if(n){n.focus();e.preventDefault();}});});
    const syncB=()=>{const b=hv('b');document.querySelectorAll('.hb').forEach(x=>x.textContent=b==null?'?':b);};
    document.querySelectorAll('.hn').forEach(el=>el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'');el.classList.remove('ok','bad');if(el.dataset.k==='b')syncB();}));syncB();
    $('#cClr').onclick=()=>{document.querySelectorAll('.cc,.hn').forEach(x=>{x.value='';x.classList.remove('ok','bad');});if(isDiv&&t.calc&&t.calc.op===':'){hset('a',t.calc.a);hset('b',t.calc.b);}syncB();$('#cMsg').className='fb';};
    if($('#cChk'))$('#cChk').onclick=isDiv?checkHalb:checkNormal;
    if($('#cHow'))$('#cHow').onclick=()=>{const a=hv('a'),b=hv('b');if(a==null||!b)return calcMsg('hint','Trage zuerst die Aufgabe in die oberste Zeile ein.');const f=firstPart(a,b);
      calcMsg('hint',f>0&&f<a?`Nimm zuerst eine Zahl, die sich gut durch ${b} teilen lässt: <b>${f}</b> (denn ${b} · ${f/b} = ${f}).<br>Dann bleibt noch <b>${a-f}</b> übrig. Rechne also ${f} : ${b} und ${a-f} : ${b}.`:f===a?`${a} lässt sich direkt gut teilen: ${b} · ${a/b} = ${a}.`:`Die Zahl ist klein. Rechne mit dem Einmaleins: Welche Zahl aus der ${b}er-Reihe liegt knapp unter ${a}? Der Unterschied ist der Rest.`);};
    $('#cTake').onclick=()=>{let v,r=null;if(isDiv){v=hv('q');r=hv('r');}else v=rowVal('3');if(v==null)return calcMsg('hint','Im Ergebnisfeld steht noch nichts.');
      const ins=[...app.querySelectorAll('input.ans')].filter(x=>!x.disabled);if(!ins.length)return;let target;
      if(t.type==='multi'&&t.fields.length===2&&/Rest/.test(t.fields[1].label)){ins[0].value=v;if(ins[1])ins[1].value=r??0;target=ins[0];}
      else{target=$('#single')||ins.find(x=>!x.value)||ins[0];target.value=v;}
      target.scrollIntoView({behavior:'smooth',block:'center'});target.classList.add('flash');setTimeout(()=>target.classList.remove('flash'),900);
      calcMsg('good',`Das Ergebnis steht jetzt im Antwortfeld.${t.unit==='€'?' Denk dran: Hast du in Cent gerechnet? Dann setze das Komma richtig.':''} Prüfe noch einmal und tippe dann auf „Prüfen“.`);};}
  function checkNormal(){const a=rowVal(0),b=rowVal(1),res=cells(3);res.forEach(x=>x.classList.remove('ok','bad'));
    if(a==null||b==null)return calcMsg('hint','Trage zuerst beide Zahlen in den Rechenkasten ein.');
    if(OPS[op]==='−'&&b>a)return calcMsg('hint','Beim Minusrechnen muss die größere Zahl oben stehen.');
    const exp=OPS[op]==='+'?a+b:OPS[op]==='−'?a-b:a*b;if(String(exp).length>COLS)return calcMsg('hint','Das Ergebnis passt nicht in den Rechenkasten.');
    if(rowVal(3)==null)return calcMsg('hint','Schreibe dein Ergebnis in die unterste Reihe, von rechts nach links.');
    const es=String(exp).padStart(COLS,' ');const wrong=[];
    res.forEach((x,c)=>{const want=es[c]===' '?'':es[c];if(want===''&&x.value==='')return;if(x.value===want)x.classList.add('ok');else{x.classList.add('bad');wrong.push(c);}});
    if(!wrong.length)return calcMsg('good','✅ <b>Deine Rechnung stimmt!</b> Tippe auf „Ergebnis übernehmen“.');
    const first=wrong[wrong.length-1],tip=OPS[op]==='+'?'Hast du den Übertrag aus der Spalte rechts daneben dazugezählt?':OPS[op]==='−'?'Musstest du hier entbündeln? Oder hast du nach dem Entbündeln vergessen, die Ziffer links um 1 kleiner zu machen?':'Hast du den Übertrag dazugezählt?';
    calcMsg('hint',`In ${wrong.length===1?'einer Spalte':wrong.length+' Spalten'} stimmt es noch nicht (rot). Schau dir zuerst die <b>${PLACE[first]}-Spalte</b> an. ${tip}`);}
  function checkHalb(){document.querySelectorAll('.hn').forEach(x=>x.classList.remove('ok','bad'));const a=hv('a'),b=hv('b');
    if(a==null||b==null)return calcMsg('hint','Trage zuerst die Aufgabe in die oberste Zeile ein: links die Zahl, die geteilt wird, dann die Zahl, durch die du teilst.');
    if(b===0)return calcMsg('hint','Durch 0 kann man nicht teilen.');
    const Qa=Math.floor(a/b),Ra=a%b,f=firstPart(a,b);
    const rows=[0,1,2].map(i=>({i,p:hv('p'+i),q:hv('q'+i),r:hv('r'+i)||0})).filter(x=>x.p!=null);
    let bad=null;rows.forEach(x=>{const good=x.q!=null&&x.q===Math.floor(x.p/b)&&x.r===x.p%b;['p','q','r'].forEach(k=>{const e=hEl(k+x.i);if(e&&(e.value||k!=='r'))e.classList.add(good?'ok':'bad');});if(!good&&!bad)bad=x;});
    const sumP=rows.reduce((s,x)=>s+x.p,0);
    if(rows.length&&sumP!==a)return calcMsg('hint',`Deine Teilzahlen ergeben zusammen <b>${rows.map(x=>x.p).join(' + ')} = ${sumP}</b>. Zusammen müssen sie aber <b>${a}</b> ergeben.`);
    if(bad){calcMsg('hint',`Die Teilaufgabe <b>${bad.p} : ${b}</b> stimmt noch nicht (rot).<br>Frag dich: <b>Wie oft passt ${b} in ${bad.p}?</b> Und was bleibt übrig?<br><button class="btn ghost" id="cShow" style="margin-top:8px;padding:6px 12px;font-size:15px">Zeig es mir</button><div id="cShowTxt"></div>`);
      const qq=Math.floor(bad.p/b),rr=bad.p%b;$('#cShow').onclick=()=>{$('#cShowTxt').innerHTML=`<div style="margin-top:8px">${bad.p} : ${b} = <b>${qq}${rr?' R '+rr:''}</b>, denn ${qq} · ${b} = ${qq*b}${rr?` und bis ${bad.p} fehlen noch ${rr}`:''}.</div>`;$('#cShow').remove();};return;}
    const restTip=rows.slice(0,-1).some(x=>x.r>0)?`<br><small>Tipp: Wähle die erste Teilzahl so, dass sie ohne Rest aufgeht, zum Beispiel ${f}.</small>`:'';
    const qv=hv('q'),rv=hv('r')||0;
    if(qv==null){if(rows.length)return calcMsg('hint',`Deine Teilaufgaben stimmen! 👍 Zähle jetzt die Ergebnisse zusammen: <b>${rows.map(x=>x.q).join(' + ')}</b>. Der Rest aus der letzten Zeile ist der Rest. Schreibe das oben hinter das =.${restTip}`);
      return calcMsg('hint','Schreibe dein Ergebnis oben hinter das =. Wenn es schwer ist, zerlege die Aufgabe in Teilaufgaben.');}

function runSnake(el,api){const [W,H]=areaSize(el),c=document.createElement('canvas');c.className='gcanvas';const dpr=window.devicePixelRatio||1;c.style.width=W+'px';c.style.height=H+'px';c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);el.appendChild(c);
  const C=Math.max(20,Math.min(30,Math.floor(Math.min(W,H)/15))),CW=Math.floor(W/C),CH=Math.floor(H/C),ox=Math.floor((W-CW*C)/2),oy=Math.floor((H-CH*C)/2);

  function draw(){ctx.fillStyle='#14301f';ctx.fillRect(0,0,W,H);ctx.fillStyle='#1d3b2a';ctx.fillRect(ox,oy,CW*C,CH*C);ctx.strokeStyle='#ffffff10';ctx.lineWidth=1;
    for(let x=0;x<=CW;x++){ctx.beginPath();ctx.moveTo(ox+x*C,oy);ctx.lineTo(ox+x*C,oy+CH*C);ctx.stroke();}for(let y=0;y<=CH;y++){ctx.beginPath();ctx.moveTo(ox,oy+y*C);ctx.lineTo(ox+CW*C,oy+y*C);ctx.stroke();}

function runTTT(el,api){const [aw,ah]=areaSize(el),sz=Math.min(aw-30,ah-160,460),me=pet().e,ko='👺';let b,wins=0,turn=null,alive=true,timers=[];

  const win=(bb,p)=>L.some(l=>l.every(i=>bb[i]===p));const render=()=>cells.forEach((c,i)=>c.textContent=b[i]==='X'?me:b[i]==='O'?ko:'');

  const draw=()=>{if(b.every(Boolean)){msg.textContent='Unentschieden! Neue Runde …';turn=null;timers.push(setTimeout(newRound,1000));return true;}return false;};
  function aiMove(){const free=b.map((v,i)=>v?null:i).filter(i=>i!==null);const tryWin=p=>{for(const i of free){b[i]=p;const w=win(b,p);b[i]=null;if(w)return i;}return null;};
    let m=Math.random()<.85?tryWin('O'):null;if(m===null&&Math.random()<.7)m=tryWin('X');if(m===null&&b[4]===null&&Math.random()<.6)m=4;if(m===null)m=pick(free);b[m]='O';render();
    if(win(b,'O')){alive=false;msg.textContent='Der Kobold hat gewonnen!';timers.push(setTimeout(()=>api.end(wins),1300));return;}if(!draw()){turn='X';msg.textContent=`Siege: ${wins} · Du bist dran!`;}}
  cells.forEach((c,i)=>c.addEventListener('click',()=>{if(!alive||turn!=='X'||b[i])return;b[i]='X';render();

const GAMES=[
 {id:'snake',name:'Drachen-Snake',icon:'🐲',desc:'Wische mit dem Finger, um den Drachen zu lenken, und sammle Kristalle. Beiß dich nicht in den Schwanz!',unit:'Kristalle',run:runSnake},
 {id:'memory',name:'Zauber-Memory',icon:'🃏',desc:'Finde alle Paare der Fabelwesen mit möglichst wenigen Zügen.',unit:'Züge',low:true,run:runMemory},
 {id:'frog',name:'Frosch-Fangen',icon:'🐸',desc:'Merlos Zauberfrösche sind entwischt! Tippe sie schnell an, bevor sie abtauchen.',unit:'Punkte',run:runFrog},
 {id:'owl',name:'Eulenflug',icon:'🦉',desc:'Tippe, damit die Eule flattert, und fliege durch die Lücken im Zauberwald.',unit:'Bäume',run:runOwl},
 {id:'brk',name:'Kristall-Breakout',icon:'💎',desc:'Lenke den goldenen Schild und zerschlage alle Kristallmauern.',unit:'Kristalle',run:runBreakout},
 {id:'catch',name:'Sternenfänger',icon:'🌟',desc:'Fang mit dem Korb die fallenden Sterne und weiche den Steinen aus.',unit:'Sterne',run:runCatch},
 {id:'simon',name:'Zauber-Runen',icon:'🔮',desc:'Die Runen leuchten in einer Reihenfolge auf. Merke sie dir und tippe sie nach!',unit:'Runen',run:runSimon},
 {id:'bubble',name:'Seifenblasen-Zauber',icon:'🫧',desc:'Bringe in 30 Sekunden so viele Zauberblasen wie möglich zum Platzen.',unit:'Blasen',run:runBubbles},
 {id:'ttt',name:'Kobold-Duell',icon:'👺',desc:'Tic-Tac-Toe gegen den frechen Kobold. Wie oft kannst du ihn besiegen?',unit:'Siege',run:runTTT},
 {id:'puzzle',name:'Kristall-Schiebepuzzle',icon:'🧩',desc:'Schiebe die Kristalle in die richtige Reihenfolge – mit möglichst wenigen Zügen.',unit:'Züge',low:true,run:runPuzzle}];
let G=null;
function stopGame(){if(!G)return;clearInterval(G.tick);try{G.inst&&G.inst.stop();}catch(e){}if(G.ov){G.ov.remove();G.ov=null;document.body.style.overflow='';}save();}
function leaveGame(){if(G){G.over=true;stopGame();G=null;}}
function showArcade(){leaveGame();window.scrollTo(0,0);const t=S.playMs||0,w=wallet();
  app.innerHTML=topbar()+`<div class="lead"><h1 style="font-size:30px">🎮 Zauber-Arkade</h1></div>
<div class="card"><div class="speech"><div class="p">${pet().e}</div><div class="bubble">${t>0?`Du hast <b>⏳ ${fmtMs(t)} Spielzeit</b> verdient. Viel Spaß!`:`Eine Runde kostet <b>${PRICE} 💎</b>. Mit jeder geschafften Quest verdienst du außerdem Spielzeit: <b>2 Minuten pro Stern</b>.`}</div></div>
<div class="arc-stat"><span>⏳ Spielzeit: <b>${fmtMs(t)}</b></span><span>💎 Kristalle: <b>${w}</b></span></div></div>
${GAMES.map(g=>{const hs=(S.high||{})[g.id];return `<div class="card game"><div class="gicon">${g.icon}</div><div><h3 class="medieval">${g.name}</h3><div class="small">${g.desc}</div><div class="small" style="margin-top:4px">🏆 Rekord: <b>${hs!=null?hs+' '+g.unit:'–'}</b></div></div><button class="btn" onclick="startGame('${g.id}')">${t>0?'Spielen ⏳':'Spielen · '+PRICE+' 💎'}</button></div>`;}).join('')}
<div class="row"><button class="btn ghost wide" style="color:#fde9b0;border-color:#fde9b088" onclick="showMap()">Zurück zur Karte</button></div>`;}
function startGame(id){leaveGame();const g=GAMES.find(x=>x.id===id);const timeMode=(S.playMs||0)>0;
  if(!timeMode){if(wallet()<PRICE)return toast(`Für eine Runde brauchst du ${PRICE} 💎. Dir fehlen noch ${PRICE-wallet()}. Löse eine Quest, dann bekommst du Kristalle und Spielzeit!`);S.spent=(S.spent||0)+PRICE;save();}
  window.scrollTo(0,0);app.innerHTML=topbar()+`<div class="card" style="padding:12px"><div class="taskhead"><span>${g.icon} ${g.name}</span><span></span></div><div id="garea" class="garea"><p class="small">Das Spiel läuft im Vollbild …</p></div><div class="row"><button class="btn ghost wide" onclick="showArcade()">Zurück zur Arkade</button></div></div>`;
  const ov=document.createElement('div');ov.className='fsgame';ov.innerHTML=`<div class="fshud"><span>${g.icon} <b class="fs-score">0</b> <small>${g.unit}</small></span><span class="fs-time">${timeMode?'⏳ '+fmtMs(S.playMs):'1 Runde'}</span><button class="fs-x" aria-label="Spiel beenden">✕</button></div><div class="fsarea"></div>`;
  document.body.appendChild(ov);document.body.style.overflow='hidden';ov.addEventListener('touchmove',e=>{if(e.target.closest('.fsarea'))e.preventDefault();},{passive:false});
  /* iPhone: kein Markieren/Kopieren-Menü, kein Doppeltipp-Zoom, keine Lupe bei schnellem Tippen */
  ov.addEventListener('touchstart',e=>{if(e.target.closest('canvas')||e.target.classList.contains('fsarea'))e.preventDefault();try{window.getSelection().removeAllRanges();}catch(_){}},{passive:false});
  ['selectstart','contextmenu','dblclick','gesturestart'].forEach(ev=>ov.addEventListener(ev,e=>e.preventDefault()));
  const sess={g,timeMode,score:0,over:false,ov};G=sess;
  const api={score:v=>{if(G!==sess)return;sess.score=v;const e=ov.querySelector('.fs-score');if(e)e.textContent=v;},end:v=>{if(G===sess)gameOver(v,false);}};
  sess.inst=g.run(ov.querySelector('.fsarea'),api);
  if(timeMode){sess.last=Date.now();sess.tick=setInterval(()=>{const now=Date.now();if(!document.hidden)S.playMs=Math.max(0,(S.playMs||0)-(now-sess.last));sess.last=now;const e=ov.querySelector('.fs-time');if(e)e.textContent='⏳ '+fmtMs(S.playMs);if(S.playMs<=0)gameOver(g.low?null:sess.score,true);},250);}
  ov.querySelector('.fs-x').onclick=()=>{if(sess.over)return;confirmBox(timeMode?'Spiel beenden? Deine restliche Spielzeit bleibt erhalten.':'Runde beenden? Die Kristalle für diese Runde sind dann verbraucht.',()=>gameOver(g.low?null:sess.score,false));};}
function gameOver(score,timeUp){const s=G;if(!s||s.over)return;s.over=true;stopGame();const g=s.g;S.high=S.high||{};const prev=S.high[g.id];let rec=false;
  if(score!=null&&(g.low?(prev==null||score<prev):score>(prev||0))){S.high[g.id]=score;rec=true;}save();const t=S.playMs||0;const area=$('#garea');if(!area)return;
  area.innerHTML=`<div class="gres"><div style="font-size:56px">${rec?'🏆':g.icon}</div><h2>${timeUp?'Spielzeit vorbei!':rec?'Neuer Rekord!':'Runde vorbei!'}</h2>${score!=null?`<p class="q">${g.unit}: <b>${score}</b></p>`:''}<p class="small">🏆 Rekord: ${S.high[g.id]!=null?S.high[g.id]+' '+g.unit:'–'}</p>${timeUp?`<p class="small">Mit der nächsten Quest verdienst du neue Spielzeit – oder spiele mit Kristallen weiter.</p>`:''}
<div class="row"><button class="btn" id="gagain">${t>0?'Nochmal ⏳':'Nochmal · '+PRICE+' 💎'}</button><button class="btn sec" id="gback">Zur Arkade</button></div>${timeUp?`<div class="row"><button class="btn ghost wide" onclick="showMap()">Zur Karte – neue Quest</button></div>`:''}</div>`;
  $('#gagain').onclick=()=>startGame(g.id);$('#gback').onclick=()=>showArcade();if(rec)sparkle(innerWidth/2,260,20);}

/* ============ Eltern ============ */
function showParents(){leaveGame();window.scrollTo(0,0);const sk=Object.entries(S.stats).sort((a,b)=>a[1].ok/a[1].all-b[1].ok/b[1].all);
  app.innerHTML=topbar()+`<div class="card"><h2>👪 Für Eltern</h2><p class="small">Der Fortschritt wird nur auf diesem Gerät im Browser gespeichert.</p>
<h3 class="medieval">Bereiche (schwächste zuerst)</h3>${sk.length?sk.map(([k,v])=>{const p=Math.round(v.ok/v.all*100);return `<div class="stat"><span>${k}</span><span style="display:flex;align-items:center">${v.ok}/${v.all} (${p} %)<span class="mini"><span style="width:${p}%"></span></span></span></div>`;}).join(''):'<p class="small">Noch keine Aufgaben gelöst.</p>'}
<h3 class="medieval">Aufgabenvorrat</h3>${(()=>{const p=poolStats();return `<div class="stat"><span>Deutsch-Aufgaben &amp; Lesetexte gelöst</span><span>${p.sol} von ${p.all}</span></div><p class="small">Gelöste Aufgaben kommen erst wieder, wenn alle anderen einer Liste dran waren. Mathe-Aufgaben bekommen immer neue Zahlen.</p>`;})()}
<h3 class="medieval">Orte</h3>${REGIONS.map(r=>`<div class="stat"><span>${r.icon} ${r.name}</span><span>${'⭐'.repeat(S.regions[r.id]?.stars||0)||'–'} · ${S.regions[r.id]?.plays||0}× gespielt</span></div>`).join('')}
<h3 class="medieval">Zauber-Arkade</h3><div class="stat"><span>Spielzeit-Guthaben</span><span>${fmtMs(S.playMs||0)}</span></div><div class="stat"><span>Kristalle verdient / ausgegeben</span><span>${S.gems} / ${S.spent||0}</span></div>${GAMES.map(g=>`<div class="stat"><span>${g.icon} ${g.name}</span><span>Rekord: ${(S.high||{})[g.id]??'–'}</span></div>`).join('')}<p class="small">Spielzeit gibt es für Quests (2 Min. pro Stern), die Quelle der Wiederholung (3 Min.), Probe-Tests (5 Min.) und die Endprüfung (10 Min.). Ohne Spielzeit kostet eine Runde 10 💎.</p>
<h3 class="medieval">Spielstand übertragen</h3><p class="small">Zum Umziehen vom Browser in die App auf dem Startbildschirm oder auf ein anderes Gerät: Code kopieren, am neuen Ort einfügen und laden. Der Code ist auch ein gutes Backup.</p>
<div class="row"><button class="btn sec wide" id="expBtn">📋 Spielstand-Code kopieren</button></div>
<textarea id="codeBox" class="ans" rows="3" style="font-size:14px;margin-top:10px;resize:vertical" placeholder="Hier einen Spielstand-Code einfügen …" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
<div class="row"><button class="btn wide" id="impBtn">Code laden</button></div><div id="codeMsg" class="fb"></div>
<h3 class="medieval">Probe-Tests</h3>${S.probes.length?S.probes.slice(-8).reverse().map(p=>`<div class="stat"><span>${p.k==='probeM'?'Mathe':'Deutsch'} · ${p.d}</span><span>${p.ok} / ${p.n}</span></div>`).join(''):'<p class="small">Noch kein Probe-Test.</p>'}
<p class="small" style="margin-top:12px">Die Aufgaben sind eigene Übungsaufgaben im Stil der Kompass-4-Kompetenzmessung (Klasse 4, Baden-Württemberg), keine Originalaufgaben des IBBW. Rechenaufgaben werden bei jedem Start neu erzeugt.</p>
<div class="row"><button class="btn sec" onclick="showStart()">Name / Begleiter ändern</button><button class="btn ghost" id="rst">Fortschritt löschen</button></div><div class="row"><button class="btn wide" onclick="showMap()">Zur Karte</button></div></div>`;
  const cmsg=(c,h)=>{const m=$('#codeMsg');m.className='fb show '+c;m.innerHTML=h;};
  $('#expBtn').onclick=async()=>{const code='KQ1:'+btoa(unescape(encodeURIComponent(JSON.stringify(S))));const box=$('#codeBox');
    try{await navigator.clipboard.writeText(code);cmsg('good','✅ Code kopiert! Öffne jetzt die App am neuen Ort, gehe in den Elternbereich, füge den Code ein und tippe auf „Code laden“.');}
    catch(e){box.value=code;box.focus();box.select();cmsg('hint','Kopieren automatisch hat nicht geklappt. Der Code steht im Feld und ist markiert – tippe ihn lange an und wähle „Kopieren“.');}};
  $('#impBtn').onclick=()=>{const raw=$('#codeBox').value.trim().replace(/\s/g,'');let o=null;
    try{if(!raw.startsWith('KQ1:'))throw 0;o=JSON.parse(decodeURIComponent(escape(atob(raw.slice(4)))));if(typeof o!=='object'||typeof o.gems!=='number')throw 0;}catch(e){return cmsg('hint','Dieser Code ist ungültig. Bitte den kompletten Code einfügen (er beginnt mit „KQ1:“).');}
    confirmBox(`Spielstand von <b>${esc(o.name||'?')}</b> laden (${o.gems} 💎)? Der Spielstand auf diesem Gerät wird dabei ersetzt.`,()=>{S=Object.assign({mistakes:{},seen:{},quests:{},high:{},probes:[],regions:{},stats:{}},o);SEEN=S.seen;save();toast(`Spielstand geladen! Willkommen zurück, ${esc(S.name||'Heldin')}!`);showMap();});};
  $('#rst').onclick=()=>confirmBox('Wirklich den gesamten Fortschritt löschen?',()=>{S={name:S.name,pet:S.pet,gems:0,regions:{},stats:{},streak:0,lastDay:'',finalDone:false,probes:[],mistakes:{},seen:{},spent:0,playMs:0,high:{},quests:{}};SEEN=S.seen;save();showMap();});}

S.name?showMap():showStart();
</script>
</body>
</html>
